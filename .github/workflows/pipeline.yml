on:
  push:
    branches:
      - main
      - dev

env:
  REGISTRY: ghcr.io
  PROD_IMAGE_NAME: medaist-frontend-prod
  DEV_IMAGE_NAME: medaist-frontend-dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Owner and Determine Image Name
        id: image_prep
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> ${GITHUB_ENV}
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "IMAGE_NAME=${{ env.PROD_IMAGE_NAME }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "IMAGE_NAME=${{ env.DEV_IMAGE_NAME }}" >> $GITHUB_ENV
          else
            echo "IMAGE_NAME=medaist-frontend-other" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha 
          cache-to: type=gha,mode=max

      - name: Deploy Application
        if: success()
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            APPLICATION_ID="${{ secrets.PROD_APP_ID }}"
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            APPLICATION_ID="${{ secrets.DEV_APP_ID }}"
          else
            echo "Skipping deployment for non-main/dev branch"
            exit 0
          fi
          
          curl -X POST 'https://panel.medaist.com/api/trpc/application.deploy?batch=1' \
            -H 'accept: */*' \
            -H 'content-type: application/json' \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            --data-raw "{\"0\":{\"json\":{\"applicationId\":\"${APPLICATION_ID}\"}}}"